services:
  - type: web
    name: royal-horse-club
    env: node
    buildCommand: npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        value: "$2a$10$T8Pq4V7x55N9mU1tM6hR7.uG.7F7p65.fL/zV8m0ZtYm2y5W6C3hO"
